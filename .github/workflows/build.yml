name: Build Minecraft 26.2 mod
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: false
      - name: Build all recovered sources
        run: gradle build --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KarlAstra-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: build/reports/
