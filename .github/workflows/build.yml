name: Build Minecraft 26.2 mod
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: false
      - name: Build all recovered sources
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain
      - name: Boot client and render every ClickGUI category with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 480s xvfb-run -a ./gradlew runClient -PsmokeTest --console=plain
          grep -q 'ASTRA_SMOKE_TEST_PASS' run/logs/latest.log
          grep -q 'ASTRA_PERSONALIZATION_TEST_PASS' run/logs/latest.log
          grep -q 'ASTRA_MIXIN_TEST_PASS' run/logs/latest.log
          grep -q 'ASTRA_MENU_TEST_PASS' run/logs/latest.log
          grep -q 'ASTRA_HUD_EDITOR_TEST_PASS' run/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KarlAstra-26.2
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: build/reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-logs
          path: |
            run/logs/
            run/crash-reports/
            run/screenshots/
